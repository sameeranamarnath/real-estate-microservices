name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  agent-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile the agent service
        run: python -m compileall -q ai
      - name: Import the graph
        continue-on-error: true
        run: |
          pip install -q -r ai/requirements.txt
          cd ai && python -c "import graph; print(len(graph.APP.get_graph().nodes), 'nodes')"