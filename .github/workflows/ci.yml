name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: lint, format, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # guardrails.py, costs.py and observability.py are standard-library only by
      # design, so the whole gate runs without a model client or a vector store.
      - name: Install tooling
        run: python -m pip install --quiet pytest ruff mypy
      - name: Lint
        run: python -m ruff check .
      - name: Format
        run: python -m ruff format --check .
      - name: Types
        run: python -m mypy
      - name: Tests
        run: python -m pytest

  service-import:
    name: service imports (best effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install service dependencies
        run: python -m pip install --quiet -r requirements.txt
      - name: Import the graph
        run: python -c "import graph; print('graph imports ok')"