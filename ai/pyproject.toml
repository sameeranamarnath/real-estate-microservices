[project]
name = "property-assistant"
version = "1.0.0"
description = "LangGraph property search that relaxes a filter rather than returning nothing."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sse-starlette>=2.1",
    "langgraph>=0.2.60",
    "langchain-core>=0.3.28",
    "langchain-openai>=0.2.14",
    "qdrant-client>=1.12",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.13"]
tracing = ["opentelemetry-sdk>=1.29", "opentelemetry-exporter-otlp-proto-http>=1.29"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.mypy]
python_version = "3.11"
files = ["guardrails.py", "costs.py", "observability.py"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true